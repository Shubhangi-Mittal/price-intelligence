name: dbt build

# Runs the full dbt project — models plus the test suite — against a DuckDB
# warehouse built from the generated feed. No cloud credentials required.
#
# This exists because the project silently stopped running once before: with
# dbt_project.yml in the wrong directory, dbt discovered 0 models and 0 tests,
# and `dbt build` happily reported "Nothing to do" and exited 0. Nothing failed,
# so nothing was noticed. The "Assert dbt discovers the project" step below is
# what turns that specific failure back into a red build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dbt-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate mock feed
        # Regenerating rather than relying on the committed CSV means the
        # generator itself is exercised, and a schema drift between what it
        # emits and what the models select fails here instead of in production.
        run: python ingestion/mock_feed_generator.py --days 90 --records 400

      - name: Load warehouse
        run: python scripts/load_duckdb.py

      - name: Install dbt packages
        working-directory: dbt_project
        run: dbt deps

      - name: Assert dbt discovers the project
        working-directory: dbt_project
        # `dbt build` exits 0 when it selects nothing, so an empty project looks
        # identical to a passing one. Fail loudly instead.
        run: |
          # `dbt --quiet list` prints node names only; without --quiet the log
          # preamble lands on stdout and inflates the counts.
          models=$(dbt --quiet list --resource-type model --output name | grep -c . || true)
          tests=$(dbt --quiet list --resource-type test --output name | grep -c . || true)
          echo "Discovered ${models} models and ${tests} tests."
          if [ "$models" -eq 0 ]; then
            echo "::error::dbt discovered 0 models. Check model-paths in dbt_project.yml."
            exit 1
          fi
          if [ "$tests" -lt 100 ]; then
            echo "::error::dbt discovered only ${tests} tests, expected 100+. Schema files may be misplaced."
            exit 1
          fi

      - name: dbt build
        working-directory: dbt_project
        run: dbt build

      - name: Upload dbt artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt_project/target/
            dbt_project/logs/
          retention-days: 7
